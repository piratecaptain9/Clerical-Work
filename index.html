<script type="module">
/* ============================================================
   報到暨班員統計（獨立系統，repo：clericalwork）
   - 與「年度課程暨勤務管理系統」共用同一個 Firebase 專案，但不修改它的程式。
   - 讀取：courses（近期或整年）、signups（只讀選定那一場）。
   - 寫入：checkins/{課程ID}（每個課程一份報到文件）、ciStats/{課程ID}（統計摘要），
           以及現場補登時的 signups＋courses.counts（與行事曆報名連動）。
   ============================================================ */
const CONFIG={apiKey:"AIzaSyB0a91-QE4yE7DAyMHhZpn2fRPXJrYPctw",authDomain:"annual-calendar-c4a37.firebaseapp.com",projectId:"annual-calendar-c4a37",appId:"1:241829509669:web:9b6496836bc486abfd5dcc"};
const CAL_URL="";        // ← 行事曆網址，例如 "../你的行事曆repo名稱/"；留空則不顯示「回行事曆」按鈕
const NEAR_BEFORE=45,NEAR_AFTER=30; // 報到頁預設只載入「今天前 45 天～後 30 天」開始的課程
const DEMO=new URLSearchParams(location.search).has("demo"),LS="cw_";

// ===== 小工具 =====
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"i"+Math.random().toString(36).slice(2,10),nk=n=>String(n).trim().toLowerCase();
const LEADERS=["負責點傳師","帶班","講師","總務組組長","文書組組長","烹飪組組長","交通組組長","視聽組組長"],CATS=["總壇","分壇","禪修","了愿"],
ZONES=["天真區","天善區","天美區","天志區","天孝區","天仁區"],SEX=["乾","坤"],WD="日一二三四五六";
const isLead=r=>LEADERS.includes(r.name),hasBz=c=>(c.roles||[]).some(r=>r.name=="班員"),isMulti=c=>c.endDate&&c.endDate!=c.date;
const md=d=>+d.slice(5,7)+"/"+ +d.slice(8),wd=d=>WD[new Date(d+"T00:00:00").getDay()];
const dayList=c=>{const r=[];for(let t=Date.parse(c.date+"T00:00:00Z"),e=Date.parse((c.endDate||c.date)+"T00:00:00Z");t<=e;t+=864e5)r.push(new Date(t).toISOString().slice(0,10));return r};
const sdays=(s,c)=>s.days&&s.days.length?s.days:dayList(c);
const todayLocal=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const addDays=(d,n)=>new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const hm=iso=>{const t=new Date(iso);return isNaN(t)?"":String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")};
const ftime=iso=>{const t=new Date(iso);return isNaN(t)?"":t.toLocaleString("sv-SE").slice(0,16)};
const zi=z=>{const i=ZONES.indexOf(z);return i<0?99:i},xi=x=>{const i=SEX.indexOf(x);return i<0?9:i},zs=z=>(z||"").replace("區","");
const pct=(a,n)=>n?Math.round(a*100/n):0;
const pbar=(a,n)=>n?`<span class="${pct(a,n)<60?"lo":""}"><span class="pb"><i style="width:${pct(a,n)}%"></i></span>${pct(a,n)}%</span>`:'<span class="mut">—</span>';
const lsGet=k=>{try{return localStorage.getItem(LS+k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(LS+k):localStorage.setItem(LS+k,v)}catch(e){}};

// ===== 資料層 =====
let F=null,M=null,lv=0,me=null;const dsubs=new Set();
async function startFirebase(){
 const B="https://www.gstatic.com/firebasejs/10.12.2/",[A,S,Au]=await Promise.all(["app","firestore","auth"].map(n=>import(B+"firebase-"+n+".js")));
 // 用獨立的 app 名稱：登入身分、本機快取都和行事曆分開，行事曆登出不會影響這裡
 const app=A.initializeApp(CONFIG,"clericalwork");let fs;
 try{fs=S.initializeFirestore(app,{localCache:S.persistentLocalCache({tabManager:S.persistentMultipleTabManager()})})}catch(e){fs=S.getFirestore(app)}
 const uc=await Au.signInAnonymously(Au.getAuth(app));F={fs,S,uid:uc.user.uid};
 try{const sn=await S.getDoc(S.doc(fs,"claims",F.uid));if(sn.exists())lv={super:2,manager:1}[sn.data().level]||0}catch(e){}}
function demoLoad(){let a={},b={};try{a=JSON.parse(localStorage.getItem("acms_v1"))||{}}catch(e){}try{b=JSON.parse(localStorage.getItem(LS+"demo"))||{}}catch(e){}
 M={courses:a.courses||[],signups:a.signups||[],cfg:a.cfg||{managerKey:"manager",superKey:"admin"},checkins:b.checkins||{},stats:b.stats||{}};lv=+lsGet("demo_lv")||0}
function demoSave(){try{const a=JSON.parse(localStorage.getItem("acms_v1")||"{}");a.signups=M.signups;a.courses=M.courses;localStorage.setItem("acms_v1",JSON.stringify(a));localStorage.setItem(LS+"demo",JSON.stringify({checkins:M.checkins,stats:M.stats}))}catch(e){}setTimeout(()=>dsubs.forEach(f=>f()))}
const dsub=f=>{dsubs.add(f);setTimeout(f);return()=>dsubs.delete(f)};
const docs=q=>q.docs.map(d=>({...d.data(),id:d.id}));
const store={
 // 課程：近期（日期範圍查詢，只讀幾堂）或整年
 listenCourses(mode,y,cb){const t=todayLocal(),from=addDays(t,-NEAR_BEFORE),to=addDays(t,NEAR_AFTER);
  if(!F)return dsub(()=>cb(M.courses.filter(c=>mode=="near"?c.date>=from&&c.date<=to:c.year==y)));
  const{fs,S}=F,q=mode=="near"?S.query(S.collection(fs,"courses"),S.where("date",">=",from),S.where("date","<=",to)):S.query(S.collection(fs,"courses"),S.where("year","==",y));
  return S.onSnapshot(q,s=>cb(docs(s)),e=>alert("讀取課程失敗："+e.message))},
 // 選定的一場：該課程的報名＋報到文件（1 份）
 listenCourse(cid,cb){const st={signups:null,ck:null},emit=()=>{if(st.signups&&st.ck)cb(st)};
  if(!F)return dsub(()=>{st.signups=M.signups.filter(s=>s.courseId==cid);st.ck=M.checkins[cid]||{};emit()});
  const{fs,S}=F,u1=S.onSnapshot(S.query(S.collection(fs,"signups"),S.where("courseId","==",cid)),s=>{st.signups=docs(s);emit()},e=>onErr("讀取報名",e)),
  u2=S.onSnapshot(S.doc(fs,"checkins",cid),s=>{st.ck=s.exists()?s.data():{};emit()},e=>onErr("讀取報到紀錄",e));
  return()=>{u1();u2()}},
 async setCi(c,d,sid,on){const v=on?{t:new Date().toISOString(),by:me.name}:null;
  if(!F){const k=M.checkins[c.id]=M.checkins[c.id]||{courseId:c.id,year:c.year,d:{}};k.d[d]=k.d[d]||{};if(v)k.d[d][sid]=v;else delete k.d[d][sid];return demoSave()}
  const{fs,S}=F;await S.setDoc(S.doc(fs,"checkins",c.id),{courseId:c.id,year:c.year,d:{[d]:{[sid]:v||S.deleteField()}}},{merge:true})},
 // 現場補登：寫入正式報名（與行事曆連動，不受名額限制）並報到
 async walkin(c,r,name,zone,sex,d,ex){const now=new Date().toISOString(),v={t:now,by:me.name};
  if(ex){const days=isMulti(c)&&!sdays(ex,c).includes(d)?[...sdays(ex,c),d].sort():null;
   if(!F){if(days)ex.days=days;return this.setCi(c,d,ex.id,true)}
   if(days)await F.S.updateDoc(F.S.doc(F.fs,"signups",ex.id),{days});return this.setCi(c,d,ex.id,true)}
  const sd={courseId:c.id,roleId:r.id,name,at:now,walkin:true,...(zone?{zone}:{}),...(sex?{sex}:{}),...(isMulti(c)?{days:[d]}:{})},sid=c.id+"__"+encodeURIComponent(nk(name));
  if(!F){M.signups.push({id:sid,...sd});return this.setCi(c,d,sid,true)}
  const{fs,S}=F,cr=S.doc(fs,"courses",c.id),sr=S.doc(fs,"signups",sid),kr=S.doc(fs,"checkins",c.id);
  await S.runTransaction(fs,async t=>{const cs=await t.get(cr),ss=await t.get(sr);
   if(!cs.exists()||cs.data().status!="active")throw Error("課程已取消或不存在");if(ss.exists())throw Error("此人已報名這堂課，請在名單中直接報到");
   const n=(cs.data().counts||{})[r.id]||0;t.set(sr,sd);t.update(cr,{["counts."+r.id]:n+1});t.set(kr,{courseId:c.id,year:c.year,d:{[d]:{[sid]:v}}},{merge:true})})},
 // 假日標示：與行事曆相同，讀 years 集合的 marks（"p"＝例假日／國定假日），只有幾份文件
 listenMarks(cb){if(!F)return dsub(()=>{let a={};try{a=JSON.parse(localStorage.getItem("acms_v1"))||{}}catch(e){}cb(a.marks||{})});
  const{fs,S}=F;return S.onSnapshot(S.collection(fs,"years"),q=>{const m={};q.docs.forEach(d=>Object.assign(m,d.data().marks||{}));cb(m)},()=>{})},
 async getStat(cid){if(!F)return M.stats[cid]||null;const s=await F.S.getDoc(F.S.doc(F.fs,"ciStats",cid));return s.exists()?s.data():null},
 async putStat(o){if(!F){M.stats[o.courseId]=o;return demoSave()}await F.S.setDoc(F.S.doc(F.fs,"ciStats",o.courseId),o)},
 async statsOfYear(y){if(!F)return Object.values(M.stats).filter(s=>s.year==y);const{fs,S}=F;return docs(await S.getDocs(S.query(S.collection(fs,"ciStats"),S.where("year","==",y))))},
 // 整年重算：讀全年課程、報名、報到，重寫每堂課的統計摘要（較耗用量，僅在需要時使用）
 async rebuild(y){let cs,sg,ck;
  if(!F){cs=M.courses.filter(c=>c.year==y);sg=M.signups;ck=M.checkins}
  else{const{fs,S}=F;cs=docs(await S.getDocs(S.query(S.collection(fs,"courses"),S.where("year","==",y))));sg=[];
   for(let i=0;i<cs.length;i+=30){const ids=cs.slice(i,i+30).map(c=>c.id);sg.push(...docs(await S.getDocs(S.query(S.collection(fs,"signups"),S.where("courseId","in",ids)))))}
   ck={};docs(await S.getDocs(S.query(S.collection(fs,"checkins"),S.where("year","==",y)))).forEach(k=>ck[k.id]=k)}
  const out=cs.filter(c=>c.status=="active").map(c=>summarize(c,sg.filter(s=>s.courseId==c.id),ck[c.id]||{}));
  if(!F){M.stats=Object.fromEntries(Object.entries(M.stats).filter(([,s])=>s.year!=y));out.forEach(o=>M.stats[o.courseId]=o);demoSave();return out}
  const{fs,S}=F,old=await this.statsOfYear(y),keep=new Set(out.map(o=>o.courseId)),ops=[...out.map(o=>b=>b.set(S.doc(fs,"ciStats",o.courseId),o)),...old.filter(o=>!keep.has(o.id)).map(o=>b=>b.delete(S.doc(fs,"ciStats",o.id)))];
  for(let i=0;i<ops.length;i+=400){const b=S.writeBatch(fs);ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}return out},
 async claim(pw){if(!F){const n=pw==M.cfg.superKey?2:pw==M.cfg.managerKey?1:0;lsSet("demo_lv",n||null);return n}
  const{fs,S}=F,ref=S.doc(fs,"claims",F.uid);for(const[l,n]of[["super",2],["manager",1]]){try{await S.setDoc(ref,{level:l,k:pw});return n}catch(e){}}return 0},
 async unclaim(){if(!F){lsSet("demo_lv",null);return}try{await F.S.deleteDoc(F.S.doc(F.fs,"claims",F.uid))}catch(e){}}};

// 統計摘要：一堂課一份，每天一個名單（姓名、區別、性別、職司、報到時間、是否現場）
function summarize(c,signups,ck){const rs=c.roles||[],days={};dayList(c).forEach(d=>days[d]=[]);
 signups.forEach(s=>{const r=rs.find(x=>x.id==s.roleId);if(!r)return;sdays(s,c).forEach(d=>{if(!days[d])return;const e=((ck.d||{})[d]||{})[s.id];
  days[d].push({n:String(s.name).trim(),z:s.zone||"",x:s.sex||"",r:r.name,t:e&&e.t?hm(e.t):"",w:s.walkin?1:0})})});
 Object.values(days).forEach(l=>l.sort((a,b)=>a.n.localeCompare(b.n,"zh-Hant")));
 return{courseId:c.id,year:c.year,title:c.title||"",category:c.category||"",date:c.date,endDate:c.endDate||"",start:c.start||"",hasBz:hasBz(c),days}}
const canon=v=>Array.isArray(v)?"["+v.map(canon).join(",")+"]":v&&typeof v=="object"?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}":JSON.stringify(v);
const sameStat=(a,b)=>!!a&&!!b&&canon({...a,at:0,by:0})==canon({...b,at:0,by:0});

// ===== 狀態 =====
let year=new Date().getFullYear(),tab="ci",cmode="near",courses=[],cid=null,day=null,cur=null,cat="",showAll=false,ready=false,composing=false;
let marks={},unM=null;const dayCls=d=>marks[d]=="p"||new Date(d+"T00:00:00").getDay()==0?"hp":new Date(d+"T00:00:00").getDay()==6?"sa":"";
// 讀取錯誤：權限不足代表管理者身分已失效（登出或密碼被變更），停止監聽並回到登入畫面，不跳錯誤視窗
function stopCourse(){if(unK){unK();unK=null}cur=null;cid=null;stats=null}
let gateMsg="";
function onErr(what,e){if(/permission/i.test(e.code||e.message||"")){if(lv>=1){stopCourse();lv=0;gateMsg="管理者身分已失效（可能是管理密碼已變更），請重新輸入密碼。";render()}return}alert(what+"失敗："+e.message)}
function subMarks(){if(!unM)unM=store.listenMarks(m=>{marks=m;refresh()})}
let unC=null,unK=null,loadingCourse=false,dirty=false,stTimer=null;
const fl={q:"",st:"all",zone:"",sex:"",role:""};
let stats=null,statsY=null,statsLoading=false,who="bz",scope="year",pq="",psort="rate",openP=new Set();
function subCourses(){if(unC)unC();unC=store.listenCourses(cmode,year,l=>{courses=l;refresh()})}
function subCourse(){if(unK){unK();unK=null}cur=null;if(!cid)return;loadingCourse=true;const id=cid;
 unK=store.listenCourse(id,st=>{if(id!=cid)return;const first=loadingCourse;loadingCourse=false;cur={...st,cid:id};if(first)checkStat();refresh()})}

async function checkStat(){const c=courses.find(x=>x.id==cid);if(!c||!cur||c.date>todayLocal())return;try{const o=await store.getStat(c.id),n=summarize(c,cur.signups,cur.ck);if(!sameStat(o,n))await saveStat(c)}catch(e){}}

 else ds.forEach((d,i)=>S0.days[d].forEach(e=>{if(!okRole(e))return;out.push({c:S0,k:S0.courseId+"|"+d,d,d2:d,multi:false,di:multi?i+1:0,e,n:1,a:e.t?1:0,on:!!e.t,wk:!!e.w,past:!multi&&d<t,now:d==t||(multi&&d<t)})}))});return out}
